<script type="text/javascript">
  RED.nodes.registerType("de-esp32-gpio-out", {
    category: "de-esp32",
    color: "#E67E22",
    defaults: {
      name: { value: "" },
      device: { type: "de-esp32-device", required: true },
      gpio: { value: "", required: true },
      pinName: { value: "" },
      pinMode: { value: "out" },
      configure: { value: true },
      pullUp: { value: false },
      invert: { value: false },
      boot: { value: 0, validate: RED.validators.number() },
      duty: { value: 0, validate: RED.validators.number() },
      hz: { value: 1000, validate: RED.validators.number() },
    },
    inputs: 1,
    outputs: 0,
    icon: "font-awesome/fa-sign-out",
    paletteLabel: "gpio out",
    align: "right",
    label: function() {
      const d = RED.nodes.node(this.device);
      const who = d ? (d.deviceName || d.host || "de-esp32") : "de-esp32";
      const mode = this.pinMode === "pwm" ? "PWM" : "GPIO";
      if (this.gpio === "" || this.gpio == null) {
        return this.name || ("gpio out " + who);
      }
      return this.name || (mode + " " + this.gpio + " → " + who);
    },
    oneditprepare: function() {
      DeEsp32.bindGpioEditor("out", "de-esp32-pinbox-out", "de-esp32-pin-refresh-out");
    },
  });
</script>

<script type="text/html" data-template-name="de-esp32-gpio-out">
  <div class="form-row">
    <label for="node-input-device"><i class="fa fa-microchip"></i> Device</label>
    <input type="text" id="node-input-device">
  </div>
  <div class="form-row">
    <label for="node-input-gpio"><i class="fa fa-circle"></i> GPIO</label>
    <input type="number" id="node-input-gpio" placeholder="4" style="width:80px">
    <button type="button" id="de-esp32-pin-refresh-out" class="red-ui-button" style="margin-left:8px">Reload pinout</button>
  </div>
  <div class="form-row">
    <label for="node-input-pinMode"><i class="fa fa-sliders"></i> Mode</label>
    <select id="node-input-pinMode" style="width:120px">
      <option value="out">Out</option>
      <option value="pwm">PWM</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-pinName"><i class="fa fa-tag"></i> Pin name</label>
    <input type="text" id="node-input-pinName" placeholder="gpio_4">
  </div>
  <div class="form-row">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-configure" style="display:inline-block;width:auto;vertical-align:top">
    <label for="node-input-configure" style="width:auto">Configure pin on deploy</label>
  </div>
  <div id="de-esp32-pmeta"></div>
  <div class="form-row" id="de-esp32-row-boot">
    <label for="node-input-boot">Power-on</label>
    <select id="node-input-boot" style="width:120px">
      <option value="0">Low</option>
      <option value="1">High</option>
    </select>
    <p class="de-esp32-hint">Level written on Apply and after reboot. Incoming messages still use pin.set for live changes.</p>
  </div>
  <div id="de-esp32-row-pwm">
    <div class="form-row">
      <label for="node-input-duty">Duty (0–1000)</label>
      <input type="number" id="node-input-duty" min="0" max="1000" style="width:90px">
      <p class="de-esp32-hint">On-time. 0 = off, 500 = 50%, 1000 = full. Saved as the boot duty.</p>
    </div>
    <div class="form-row">
      <label for="node-input-hz">Frequency (Hz)</label>
      <input type="number" id="node-input-hz" min="50" max="20000" style="width:90px">
      <p class="de-esp32-hint">50–20000 Hz. Every PWM pin shares one timer — last configure sets frequency for all of them.</p>
    </div>
  </div>
  <div class="form-row" id="de-esp32-row-pull">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-pullUp" style="display:inline-block;width:auto;vertical-align:top">
    <label for="node-input-pullUp" style="width:auto">Internal pull-up</label>
    <p class="de-esp32-hint">Holds a floating pin at 3.3 V. Off if you have an external pull. GPIO 34–39 have no internal pull.</p>
  </div>
  <div class="form-row" id="de-esp32-row-inv">
    <label>&nbsp;</label>
    <input type="checkbox" id="node-input-invert" style="display:inline-block;width:auto;vertical-align:top">
    <label for="node-input-invert" style="width:auto">Invert logic</label>
    <p class="de-esp32-hint" id="de-esp32-invhint"></p>
  </div>
  <div id="de-esp32-pinbox-out"></div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name">
  </div>
</script>

<script type="text/html" data-help-name="de-esp32-gpio-out">
  <p>Drives a digital output or PWM. <code>msg.payload</code> is 0/1 (or on/off) for Out; 0–1000 duty for PWM.</p>
  <p>Pads show chip capabilities from <code>GET /api/v1/hardware</code>. Input-only and flash pads cannot be selected for Out/PWM.</p>
  <p>On deploy (unless unchecked) sends <code>pin.configure</code> with pull-up / invert / power-on level, or duty / Hz in PWM mode. Each message sends <code>pin.set</code>.</p>
</script>
