<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>de-esp32</title>
<style>
:root{
  --bg:#0f1419;--fg:#e7edf4;--muted:#8b97a8;--card:#171e27;--line:#2a3544;
  --acc:#6aa4ff;--ok:#3dba6e;--bad:#e05a5a;--warn:#e0a84a;--in:#0b1016;
  --tab:var(--acc);--r:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.45 system-ui,sans-serif;-webkit-text-size-adjust:100%}
code{font-size:.85em;background:var(--in);padding:1px 6px;border-radius:4px}
.i{width:20px;height:20px;flex:0 0 auto}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--bg)}
.brand{display:flex;gap:10px;align-items:flex-start;min-width:0}
.brand>.i{width:28px;height:28px;color:var(--acc);margin-top:2px}
header strong{color:var(--fg);font-size:17px}
.sub{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-all}
#pills{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:58%}
nav{display:flex;flex-wrap:nowrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:2;background:var(--bg)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 10px;min-height:52px;min-width:64px;cursor:pointer;flex:0 0 auto;font-size:11px;border-radius:var(--r);--tc:var(--acc)}
nav button .i{color:inherit}
nav button.on{border-color:var(--tc);color:var(--tc);background:var(--in)}
main{padding:12px;max-width:1080px;margin:0 auto}
.hw-split{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--tab);padding:14px;margin:0 0 12px;border-radius:var(--r)}
.hw-split>.card{margin-bottom:0}
.card.hot{border-top-color:var(--bad)}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:15px;font-weight:650;color:var(--tab)}
.card h2 .i{width:18px;height:18px}
label{display:block;margin:10px 0 4px;color:var(--muted);font-size:13px}
input,select,textarea{width:100%;padding:10px;background:var(--in);border:1px solid var(--line);color:var(--fg);font-size:16px;border-radius:var(--r)}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--acc)}
button.act{margin:8px 8px 0 0;padding:12px 14px;min-height:44px;background:var(--acc);border:0;color:#000;cursor:pointer;font-size:15px;border-radius:var(--r);font-weight:600}
button.act.sec{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500}
button.danger{background:var(--bad);color:#fff}
button:disabled{opacity:.4;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.filts button{padding:6px 10px;min-height:36px;border:1px solid var(--line);background:var(--in);color:var(--muted);border-radius:99px;cursor:pointer;font-size:12px}
.filts button.on{color:var(--tab);border-color:var(--tab);background:var(--card)}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.modes button{flex:1 1 4.2em;padding:10px 8px;min-height:44px;border:1px solid var(--line);background:var(--in);color:var(--muted);border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:650}
.modes button.on{color:var(--fg);border-color:var(--tab);background:var(--card)}
.field .hint,.checkfield .hint{margin:4px 0 0}
.checkfield{margin:12px 0}
.checkfield .hint{margin:0 0 0 26px}
.pinwrap{overflow-x:auto;position:relative}
.rulelinks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.pad.rule-src{border-color:#c084fc;box-shadow:0 0 0 1px rgba(192,132,252,.45)}
.pad.rule-dst{border-color:#3dcec0;box-shadow:0 0 0 1px rgba(61,206,192,.4)}
.pad .rule{font-size:11px;color:#c084fc;font-variant-numeric:tabular-nums}
.pad .rule:empty{display:none}
.pad.dstpick{outline:2px dashed #3dcec0;outline-offset:1px}
.pinout{display:grid;grid-template-columns:minmax(0,1fr) 14px 108px 14px minmax(0,1fr);grid-template-rows:repeat(var(--n,19),minmax(36px,auto));column-gap:8px;row-gap:3px;align-items:stretch;min-width:720px;--n:19}
.pcb{grid-column:2/5;grid-row:1/-1;background:#152018;border:1.4px solid #3dcec0;border-radius:10px;z-index:0;pointer-events:none}
.mod{grid-column:3;grid-row:1/span 3;z-index:1;pointer-events:none;background:#1c2430;border:1px solid #8b97a8;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted);text-align:center;padding:4px}
.mod strong{color:var(--fg);font-size:12px}
.usb{grid-column:3;grid-row:-3/-1;z-index:1;pointer-events:none;background:#c5ccd6;color:#0b1016;border-radius:3px;align-self:end;justify-self:center;width:42px;padding:3px 0;margin-bottom:4px;text-align:center;font-size:10px;font-weight:700}
.pad{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:1px;padding:4px 8px;background:var(--in);border:1px solid var(--line);border-radius:6px;color:var(--fg);cursor:pointer;text-align:right;min-height:0;font:inherit;grid-column:1;grid-row:var(--row);z-index:1}
.pad.r{align-items:flex-start;text-align:left;grid-column:5}
.hole{grid-column:2;grid-row:var(--row);z-index:1;width:9px;height:9px;border-radius:50%;background:#0b1016;border:1px solid #8b97a8;align-self:center;justify-self:center}
.hole.r{grid-column:4}
.pad .silk{font-weight:700;font-size:13px;line-height:1.2}
.pad .caps{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end}
.pad.r .caps{justify-content:flex-start}
.pad .use{font-size:11px;color:var(--ok);font-variant-numeric:tabular-nums}
.pad .use:empty{display:none}
.pad.dim{opacity:.28}
.pad.sel{border-color:var(--tab);box-shadow:0 0 0 1px var(--tab)}
.pad.on .silk{color:var(--ok)}
.pad.pwr{cursor:default}
.b.pwm{color:#f0abfc;border-color:rgba(240,171,252,.33)}
.b.touch{color:#67e8f9;border-color:rgba(103,232,249,.33)}
.b.dac{color:#fdba74;border-color:rgba(253,186,116,.33)}
.b.role{color:#a5b4fc;border-color:rgba(165,180,252,.33)}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.cmdrow{cursor:pointer}.cmdrow:hover td{color:var(--acc)}
pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:var(--in);padding:10px;font-size:12px;border-radius:var(--r);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill.ok{color:var(--ok);border-color:rgba(61,186,110,.33)}
.pill.warn{color:var(--warn);border-color:rgba(224,168,74,.33)}
.pill.bad{color:var(--bad);border-color:rgba(224,90,90,.33)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.banner{display:flex;gap:10px;align-items:flex-start;background:#2a2208;border:1px solid #8a7030;color:#f0d9a0;padding:10px 12px;margin:8px 12px 0;border-radius:var(--r)}
.banner .i{width:18px;height:18px;flex:0 0 auto;margin-top:1px}
.msg{margin:8px 12px 0;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:var(--r)}
.msg.ok{border-color:rgba(61,186,110,.4);color:var(--ok)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.ssidpick{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin:6px 0 0;padding:12px;background:var(--in);border:1px solid var(--line);color:var(--fg);font-size:16px;text-align:left;cursor:pointer;min-height:44px;border-radius:var(--r)}
.ssidpick:hover,.ssidpick:focus{border-color:var(--acc)}
.rssi{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.bars i{display:block;width:3px;background:var(--line);border-radius:1px;font-style:normal}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:14px}
.bars i.on{background:var(--ok)}.bars.weak i.on{background:var(--warn)}
.check{display:flex;align-items:center;margin:10px 0;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(88px,28%) 1fr;gap:7px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted);margin:0}.kv dd{margin:0;word-break:break-all}
.b{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
.b.io{color:#3dcec0;border-color:rgba(61,206,192,.33)}.b.in{color:var(--acc);border-color:rgba(106,164,255,.33)}
.b.mute{color:var(--muted)}.b.warn{color:var(--warn);border-color:rgba(224,168,74,.33)}.b.adc{color:#c084fc;border-color:rgba(192,132,252,.33)}
.bar{height:8px;background:var(--in);border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--acc);width:0}
.gauge{display:flex;align-items:center;gap:8px;margin:8px 0 0}
.gauge .track{flex:1;height:10px;background:var(--in);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.gauge .track>i{display:block;height:100%;width:0;background:#c084fc}
.gauge .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.adcbar{height:4px;width:100%;background:var(--in);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:2px}
.adcbar>i{display:block;height:100%;width:0;background:#c084fc}
.dashh{margin:16px 0 8px;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dashh:first-child{margin-top:0}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.vcard{--vc:var(--muted);background:var(--in);border:1px solid var(--line);border-top:3px solid var(--vc);border-radius:var(--r);padding:12px;min-height:132px;display:flex;flex-direction:column;gap:6px;color:var(--vc)}
.vcard.in{--vc:#6aa4ff}.vcard.adc{--vc:#c084fc}.vcard.out{--vc:#e0a84a}.vcard.pwm{--vc:#f0abfc}.vcard.servo{--vc:#fb923c}.vcard.mod{--vc:#3dcec0}
.vcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vcard .kind{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.vcard .kind .i{width:16px;height:16px}
.vcard .pin{color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.vcard .read{color:var(--fg);font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15}
.vcard .subr{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.lamp{display:flex;align-items:center;gap:12px;margin-top:auto}
.led{width:22px;height:22px;border-radius:50%;background:#12181f;box-shadow:inset 0 0 0 2px var(--vc);flex:0 0 auto;opacity:.55}
.vcard.out .led{width:16px;height:16px;margin:3px;border-radius:3px;transform:rotate(45deg)}
.led.on{background:var(--vc);opacity:1;box-shadow:0 0 14px var(--vc)}
.dial{color:var(--vc);margin-top:2px}
.dial svg{width:100%;height:auto;display:block}
.dial .track{opacity:.22}
.meters{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.meter{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;color:var(--muted);font-size:11px}
.meter .track{height:6px;background:#12181f;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter .track>i{display:block;height:100%;width:0;background:var(--vc)}
.meter .n{font-variant-numeric:tabular-nums;color:var(--fg)}
.modmosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.modmosaic .addon{margin:0;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--in);cursor:pointer}
.addonhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.addonhead .act{margin:0}
.addon .modes{margin:8px 0 0}
.addon .live{margin:8px 0 0;font-size:18px}
.addonhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.addonhead .act{margin:0}
.addon .modes{margin:8px 0 0}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}
.steps span{flex:1 1 4.8em;text-align:center;padding:6px 4px;border-radius:99px;font-size:11px;color:var(--muted);border:1px solid var(--line)}
.steps span.on{color:var(--tab);border-color:var(--tab);background:var(--in)}
.steps span.done{color:var(--ok);border-color:rgba(61,186,110,.33)}
.pick{display:flex;flex-direction:column;gap:8px}
.pickbtn{display:flex;width:100%;text-align:left;padding:12px;background:var(--in);border:1px solid var(--line);color:var(--fg);border-radius:var(--r);cursor:pointer;font:inherit}
.pickbtn:hover,.pickbtn.on{border-color:var(--tab)}
.pickbtn strong{display:block;font-size:14px}
.pickbtn span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pinpick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pinpick button{min-width:52px;padding:8px 10px;min-height:40px;border:1px solid var(--line);background:var(--in);color:var(--fg);border-radius:var(--r);cursor:pointer;font-size:13px}
.pinpick button.on{border-color:var(--tab);color:var(--tab)}
.wizacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wizacts .act{margin:0}
details.adv{margin:10px 0 0;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--in)}
details.adv summary{cursor:pointer;color:var(--muted);font-size:13px}
.wait{color:var(--muted);padding:20px 8px}
@media(max-width:640px){.row{grid-template-columns:1fr}#pills{max-width:100%;justify-content:flex-start}}
@media(max-width:720px){.pinout{grid-template-columns:1fr 1fr;grid-template-rows:none;min-width:0}.pcb,.mod,.usb{grid-column:1/-1;grid-row:1}.pcb{min-height:120px}.mod{max-width:120px;justify-self:center;align-self:center}.usb{align-self:end;margin-bottom:8px}.hole{display:none}.pad,.pad.r{grid-row:auto}.pad{grid-column:1}.pad.r{grid-column:2}}
@media(min-width:1100px){
  main{max-width:1360px}
  .hw-split{grid-template-columns:minmax(0,1fr) minmax(320px,400px);align-items:start}
  .hw-cfg{position:sticky;top:72px;max-height:calc(100dvh - 84px);overflow:auto}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M12 7V4m0 16v-3M7 12H4m16 0h-3"/></svg>
    <div><strong id="title">de-esp32</strong><div class="sub" id="sub">connecting…</div></div>
  </div>
  <div id="pills"></div>
</header>
<div class="banner" id="prov" hidden>
  <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01"/><path d="M10.3 4.3 2.8 18a2 2 0 001.7 3h15a2 2 0 001.7-3L13.7 4.3a2 2 0 00-3.4 0z"/></svg>
  <span>Join this recovery Wi-Fi, then set your home network below. After it works, copy the STA IP before switching phones back.</span>
</div>
<div class="msg" id="msg" hidden></div>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const IC={
ov:'<path d="M4 12l8-8 8 8"/><path d="M6 10v10h12V10"/>',
hw:'<rect x="8" y="8" width="8" height="8" rx="1"/><path d="M12 8V5m0 14v-3M8 12H5m14 0h-3"/>',
pin:'<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/>',
net:'<path d="M5 12.5a9.5 9.5 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/>',
mq:'<path d="M12 20v-9"/><circle cx="12" cy="8" r="2"/><path d="M7 13a7 7 0 0110 0M4 10a11 11 0 0116 0"/>',
log:'<path d="M8 6h13M8 12h13M8 18h13M4 6h.01M4 12h.01M4 18h.01"/>',
sys:'<path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="16" r="2"/>',
api:'<path d="M9 8l-5 4 5 4M15 8l5 4-5 4"/>',
din:'<path d="M14 12H3M10 8l4 4-4 4"/><rect x="14" y="4" width="6" height="16" rx="1"/>',
dout:'<path d="M10 12h11M17 8l4 4-4 4"/><rect x="4" y="4" width="6" height="16" rx="1"/>',
dadc:'<path d="M4 19V5M4 19h16M8 15l3-5 3 3 4-7"/>',
dpwm:'<path d="M3 12h2l2-6 4 12 3-6h7"/>',
dservo:'<path d="M12 7a5 5 0 105 5"/><path d="M12 3v4M12 12l4-2"/>',
dmod:'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M12 7V4m0 16v-3M7 12H4m16 0h-3"/>'
};
const TABS=[
  {n:"Overview",c:"#6aa4ff",k:"ov"},
  {n:"Hardware",c:"#e0a84a",k:"hw"},
  {n:"Network",c:"#4ade80",k:"net"},
  {n:"MQTT",c:"#b794f6",k:"mq"},
  {n:"Logs",c:"#94a3b8",k:"log"},
  {n:"System",c:"#f08060",k:"sys"},
  {n:"API",c:"#7dd3fc",k:"api"}
];
let tab="Overview", st=null, hw=null, spec=null, ws, drawn=null, picked=false, pinFilter="all", selGpio=null, wantWs=true, pinCfg={}, mods=null, modCat=null, wiz=null, rules=[], rulePick=false, ruleDest=null, dashKey="", dashWant=false;
const MODE_LAB={in:"In",out:"Out",pwm:"PWM",servo:"Servo",adc:"ADC",disabled:"Off"};
const MODE_HINT={
  in:"Digital input. Each stable edge is published over MQTT and the live UI.",
  out:"Digital output. Apply saves the power-on level; Set HIGH/LOW changes it live.",
  pwm:"PWM output. Duty is 0–1000 (0–100%). All PWM pins share one frequency.",
  servo:"Hobby servo at 50 Hz (8 channels, separate from PWM). Angle 0–180. Default pulse 500–2500 µs; change it if this servo does not match. Apply saves rest position.",
  adc:"Analog input on ADC1 (~0–3.3 V). This mode cannot drive the pin.",
  disabled:"Release the pin (high impedance). Stops sampling and output."
};
const nav=document.getElementById("nav");
function ico(k){return `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]||""}</svg>`;}
function h2(title,k){return `<h2>${ico(k)}${title}</h2>`;}
function kv(rows){return `<dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;}
TABS.forEach(t=>{
  const b=document.createElement("button");
  b.type="button";
  b.style.setProperty("--tc",t.c);
  b.innerHTML=ico(t.k)+"<span>"+t.n+"</span>";
  b.onclick=()=>{picked=true;tab=t.n;drawn=null;render()};
  nav.appendChild(b);
});
function j(path,opt){return fetch(path,opt).then(r=>r.json());}
function cmd(body){return j("/api/v1/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function net(){return (st&&st.network)||{};}
function netTone(s){
  if(s==="sta_connected") return "ok";
  if(s==="sta_connecting"||s==="apsta_recovery"||s==="ap_only") return "warn";
  return s?"bad":"";
}
function heap(n){

function dashChannels(){

function ruleOfSrc(g){return (rules||[]).find(r=>r.on&&r.on.gpio===g);}

function applyPinFilter(){

    const picking=!!(wiz&&wiz.picking);

    else if(f==="all") ok=true;
    else if(f==="io") ok=!!(p&&(p.input||p.output)&&!p.flash);
    else if(f==="adc") ok=!!(p&&(p.adc1||p.adc2));
    else if(f==="pwm") ok=!!(p&&p.pwm&&!p.flash);

    else if(f.indexOf("mod:")===0){
      const id=f.slice(4);

function selectPad(gpio, kind, silk){

function claimCard(gpio, own, kind){
  const role=pinRoleName(gpio);
  const roleBit=role?role+" on ":"";
  if(kind==="servo"){
    return `<p><strong>GPIO ${gpio}</strong> <span class="b pwm">Servo</span></p>
      <p class="hint">Hobby servo owns this pin. Remove it before configuring the GPIO.</p>
      <button class="act sec" type="button" id="claimrm" data-servo="${gpio}">Remove servo</button>`;
  }
  const using=kind==="bus"
    ? ((mods&&mods.modules)||[]).filter(m=>m.bus===own.slice(4))
    : ((mods&&mods.modules)||[]).filter(m=>m.id===own.slice(4));
  const names=using.map(m=>m.id);
  const who=kind==="bus"?ownerLabel(own):ownerLabel(own);
  let extra="";
  if(names.length===1){
    extra=`<p class="hint">${esc(who)} owns ${esc(roleBit)}GPIO ${gpio}, used by ${esc(names[0])}. Remove ${esc(names[0])} before configuring this pin.</p>
      <button class="act sec" type="button" id="claimrm" data-rm="${esc(names[0])}">Remove ${esc(names[0])}</button>`;
  }else if(names.length>1){
    extra=`<p class="hint">${esc(who)} owns ${esc(roleBit)}GPIO ${gpio}, used by ${esc(names.join(" and "))}. Remove each addon before configuring this pin.</p>`;
  }else{
    extra=`<p class="hint">${esc(who)} owns ${esc(roleBit)}GPIO ${gpio}. Remove that addon before configuring this pin.</p>`;
  }
  return `<p><strong>GPIO ${gpio}</strong></p>${extra}`;
}
async function removeClaim(id, servo){

    const r=await cmd({cmd:"pin.configure",pin:{gpio,mode:"disabled",name:"gpio_"+gpio}});
    showMsg(r.ok?"Servo released":(r.error||"failed"), !r.ok);
    if(r.ok){ hw=null; drawn=null; refresh(); }
    return;
  }
  if(!id) return;
  const r=await cmd({cmd:"module.remove",id});
  showMsg(r.ok?"Removed":(r.error||"failed"), !r.ok);
  if(r.ok){ mods=r.result; hw=null; drawn=null; if(pinFilter==="mod:"+id) pinFilter="all"; refresh(); }
}
function syncPinExtras(){
  const mode=currentMode();

  const locked=!!(p&&p.flash);
  const u=selGpio!=null?ioOf(selGpio):null;
  const saved=(selGpio!=null&&pinCfg[selGpio])||{};
  const hint=pinField("pmodehint");
  if(hint) hint.textContent=MODE_HINT[mode]||"";
  const show=id=> { const n=pinField(id); if(n) n.hidden=false; };
  const hide=id=> { const n=pinField(id); if(n) n.hidden=true; };
  (mode==="in"?show:hide)("prow-deb");
  (mode==="adc"?show:hide)("padc");
  (mode==="out"?show:hide)("prow-boot");
  (mode==="pwm"?show:hide)("prow-pwm");
  (mode==="servo"?show:hide)("prow-servo");
  const canPull=!!(p&&p.pull)&&(mode==="in"||mode==="out");
  (canPull?show:hide)("prow-pull");
  ((mode==="in"||mode==="out")?show:hide)("prow-inv");
  const invHint=pinField("pinvhint");
  if(invHint){
    invHint.textContent=mode==="out"
      ?"Logical 1 drives the pin LOW (active-low LED or relay). Logical 0 drives HIGH."
      :"Report electrical LOW as 1 (active-low button or sensor).";
  }
  const fill=(id, live, fallback)=>{
    const n=pinField(id);
    if(!n || document.activeElement===n) return;
    n.value=live!=null?live:fallback;
  };
  fill("pdeb", u&&u.debounce_ms, saved.deb??50);
  fill("psamp", u&&u.sample_ms, saved.samp??50);
  fill("physt", u&&u.hysteresis_mv, saved.hyst??20);
  fill("psmooth", u&&u.smooth, saved.smooth??70);
  fill("pangle", u&&u.angle, saved.angle??90);
  fill("pminu", u&&u.min_us, saved.minu??500);
  fill("pmaxu", u&&u.max_us, saved.maxu??2500);
  const cfg=pinField("pcfg");
  const on=pinField("pon");

  }

function bindPinEditor(){
  const cfg=pinField("pcfg");
  if(!cfg || cfg.dataset.bound) return;
  cfg.dataset.bound="1";
  const gpioOrMsg=()=>{
    if(selGpio==null){showMsg("Pick a GPIO", true);return null;}
    return selGpio;
  };
  const modes=pinField("pmodes");
  if(modes) modes.onclick=e=>{
    const b=e.target.closest("button[data-mode]");

    const mode=currentMode();
    const name=pinVal("pname","gpio_"+gpio);
    const pin={gpio,mode,name};
    if(mode==="in"||mode==="out"){
      pin.pull_up=!!(pinField("ppull")&&pinField("ppull").checked);
      pin.invert=!!(pinField("pinvert")&&pinField("pinvert").checked);
    }
    if(mode==="out") pin.boot=+pinVal("pboot",0)?1:0;
    if(mode==="in"){ pin.debounce_ms=+(pinVal("pdeb",50)); pin.irq=true; }
    if(mode==="pwm"){
      pin.duty=+(pinVal("pduty",0));
      pin.hz=+(pinVal("phz",1000));
    }
    if(mode==="servo"){
      pin.angle=+(pinVal("pangle",90));
      pin.min_us=+(pinVal("pminu",500));
      pin.max_us=+(pinVal("pmaxu",2500));
    }
    if(mode==="adc"){
      pin.sample_ms=+(pinVal("psamp",50));
      pin.hysteresis_mv=+(pinVal("physt",20));
      pin.smooth=+(pinVal("psmooth",70));
    }
    const r=await cmd({cmd:"pin.configure",pin});
    rememberPin(gpio);
    showMsg(r.ok?"Pin applied":(r.error||"failed"), !r.ok); refresh();
  };
  const setLive=(value)=>{
    const g=gpioOrMsg();
    if(g==null) return;
    const mode=currentMode();
    if(mode!=="out"&&mode!=="pwm") return;
    if(mode==="pwm"){
      const d=pinField("pduty");
      if(d) d.value=value;
    }
    return cmd({cmd:"pin.set",gpio:g,value,mode}).then(refresh);
  };
  pinField("pon").onclick=()=>setLive(currentMode()==="pwm"?1000:1);
  pinField("poff").onclick=()=>setLive(0);
  const sbtns=pinField("pservog");
  if(sbtns) sbtns.onclick=e=>{
    const b=e.target.closest("button[data-angle]");
    if(!b) return;
    const g=gpioOrMsg();
    if(g==null) return;
    const angle=+b.dataset.angle;
    const a=pinField("pangle");
    if(a) a.value=angle;
    cmd({cmd:"pin.set",gpio:g,value:angle,mode:"servo"}).then(refresh);
  };
  const dests=pinField("rdests");
  if(dests) dests.onclick=e=>{
    const b=e.target.closest("button[data-gpio]");
    if(!b) return;
    const g=+b.dataset.gpio;
    if(!ruleCanTake(g)){ showMsg("That pin is not an output", true); return; }
    setRuleDest(g);
    paintRuleForm();
    paintPinUses();
  };
  const pick=pinField("rpick");
  if(pick) pick.onclick=()=>{
    if(selGpio==null){ showMsg("Pick an input pin first", true); return; }
    rulePick=true;
    paintRuleForm();
    applyPinFilter();
  };
  const lvl=pinField("rlevelg");
  if(lvl) lvl.onclick=e=>{
    const b=e.target.closest("button[data-v]");
    if(!b) return;
    const hid=pinField("rlevel");
    if(hid) hid.value=b.dataset.v;
    [...lvl.querySelectorAll("button")].forEach(x=>x.classList.toggle("on", x===b));
  };
  const theng=pinField("rtheng");
  if(theng) theng.onclick=e=>{
    const b=e.target.closest("button[data-v]");
    if(!b) return;
    const hid=pinField("rthenv");
    if(hid) hid.value=b.dataset.v;
    [...theng.querySelectorAll("button")].forEach(x=>x.classList.toggle("on", x===b));
  };
  const elseg=pinField("relseg");
  if(elseg) elseg.onclick=e=>{
    const b=e.target.closest("button[data-v]");
    if(!b) return;
    const hid=pinField("relsev");
    if(hid) hid.value=b.dataset.v;
    [...elseg.querySelectorAll("button")].forEach(x=>x.classList.toggle("on", x===b));
  };
  const save=pinField("rsave");
  if(save) save.onclick=async()=>{
    if(selGpio==null){ showMsg("Pick an input pin", true); return; }
    const mode=currentMode();
    if(mode!=="in"&&mode!=="adc"){ showMsg("Rules live on In or ADC pins", true); return; }
    const src=ioOf(selGpio);
    if(!src||(src.mode!=="in"&&src.mode!=="adc")){ showMsg("Apply this pin as In or ADC first", true); return; }
    if(ruleDest==null||!ruleCanTake(ruleDest)){ showMsg("Pick an output pin", true); return; }
    if(ruleDest===selGpio){ showMsg("Output must be a different pin", true); return; }
    let op="eq", value=1;
    if(mode==="adc"){
      op=pinVal("rop","gt");
      value=+pinVal("rth",1000);
      if(!Number.isFinite(value)){ showMsg("Enter a millivolt threshold", true); return; }
    }else{
      value=+pinVal("rlevel",1)?1:0;
      op="eq";
    }
    const thenV=ruleThenValue();
    const elseV=ruleElseValue();
    if(!Number.isFinite(thenV)||!Number.isFinite(elseV)){ showMsg("Then / else need a number", true); return; }
    const r=await cmd({cmd:"rule.set",rule:{
      on:{gpio:selGpio,op,value},
      then:{gpio:ruleDest,value:thenV},
      else:{gpio:ruleDest,value:elseV}
    }});
    if(r.ok) rules=(r.result&&r.result.rules)||[];
    showMsg(r.ok?"Rule saved":(r.error||"failed"), !r.ok);
    paintRuleForm();
    paintPinUses();
  };
  const del=pinField("rdel");
  if(del) del.onclick=async()=>{
    if(selGpio==null) return;
    const r=await cmd({cmd:"rule.remove",gpio:selGpio});
    if(r.ok) rules=(r.result&&r.result.rules)||[];
    ruleDest=null;
    showMsg(r.ok?"Rule removed":(r.error||"failed"), !r.ok);
    paintRuleForm();
    paintPinUses();
  };
}
function typeById(t){return ((modCat&&modCat.types)||[]).find(x=>x.type===t);}
function busPins(busId){
  const b=(hw&&hw.buses||[]).find(x=>x.id===busId);
  return (b&&b.pins)||{};
}
function busById(id){return (hw&&hw.buses||[]).find(b=>b.id===id);}
function nextModId(prefix){
  const have=new Set(((mods&&mods.modules)||[]).map(m=>m.id));
  for(let i=0;i<16;i++){ const id=(prefix||"rfid")+i; if(!have.has(id)) return id; }
  return (prefix||"rfid")+"x";
}
function typeCount(type){return ((mods&&mods.modules)||[]).filter(m=>m.type===type).length;}
function addonServos(){
  const io=(st&&st.io)||{};
  const seen={}, out=[];
  Object.keys(io).forEach(k=>{
    const u=io[k];
    if(u&&u.mode==="servo"&&u.gpio!=null&&!seen[u.gpio]){ seen[u.gpio]=1; out.push(u); }
  });
  return out.sort((a,b)=>a.gpio-b.gpio);
}
function pinTaken(g){
  const o=pinOwner(g);
  if(o && String(o).indexOf("bus_")!==0) return true;
  const u=ioOf(g);
  return !!(u && u.mode && u.mode!=="disabled");
}
function instRoles(t){return (t&&t.pins||[]).filter(p=>p.share!=="bus");}
function busRoles(t){return (t&&t.pins||[]).filter(p=>p.share==="bus");}
function roleHint(role){
  if(!role) return "";
  if(role.share==="bus") return "Taken from the bus and shared with other devices on it.";
  if(role.role==="cs") return "Chip-select. On an RC522 the pad labelled SDA is CS, not I2C. Click it on the pinout.";
  if(role.role==="rst") return "Reset. Skip if RST is tied high on the module.";
  if(role.role==="sda") return "I2C data. Default GPIO 21. Shared with every device on this bus.";
  if(role.role==="scl") return "I2C clock. Default GPIO 22. Shared with every device on this bus.";
  return role.required?"Click a free GPIO on the pinout, or a button below.":"Optional. Skip if unused.";
}
function wizCurrentGpio(){
  if(!wiz||!wiz.picking) return null;
  if(wiz.kind==="servo") return wiz.gpio!=null?wiz.gpio:null;
  const v=(wiz.pins||{})[wiz.picking];
  return v==null?null:+v;
}
function wizCanTake(g){
  if(!wiz||!wiz.picking||g==null) return false;
  const p=pinByGpio(g);
  if(!p||p.flash) return false;
  const cur=wizCurrentGpio();
  if(wiz.kind==="servo"){
    if(!(p.output&&p.pwm&&!p.input_only)) return false;
    return g===cur || !pinTaken(g);
  }
  const t=typeById(wiz.type);
  const role=(t&&t.pins||[]).find(r=>r.role===wiz.picking);
  if(!role) return false;
  if(role.cap==="out" && (!p.output||p.input_only)) return false;
  if(role.cap==="in" && !p.input) return false;
  const bp=busPins(wiz.bus);
  if(Object.entries(bp).some(([k,v])=>k!=="ss" && +v===g)) return false;
  if(Object.entries(wiz.pins||{}).some(([k,v])=>k!==wiz.picking && +v===g)) return false;
  return g===cur || !pinTaken(g);
}
function wizPinButtons(selected){
  return (hw&&hw.pins||[]).filter(p=>p.gpio!=null&&(p.gpio===selected||wizCanTake(p.gpio))).map(p=>{
    const g=p.gpio;
    return `<button type="button" data-gpio="${g}" class="${g===selected?"on":""}">GPIO ${g}</button>`;
  }).join("");
}
function busShareKeys(busId){
  return Object.keys(busPins(busId)).filter(k=>k!=="ss");
}
function busConflicts(busId){
  const p=busPins(busId);
  return busShareKeys(busId).map(k=>{
    const g=p[k];
    if(g==null||!pinTaken(+g)) return null;
    return "GPIO "+g+" is "+modePhrase(ioOf(+g), pinOwner(+g));
  }).filter(Boolean);
}
function busConflictText(b){
  const p=(b&&b.pins)||busPins(b&&b.id);
  const bits=Object.keys(p).filter(k=>k!=="ss").map(k=>{
    const g=p[k];
    if(g==null||!pinTaken(+g)) return null;
    return "GPIO "+g+" is "+modePhrase(ioOf(+g), pinOwner(+g));
  }).filter(Boolean);
  if(!bits.length) return "";
  const mid=bits.length===1?bits[0]:bits.slice(0,-1).join(", ")+" and "+bits[bits.length-1];
  return (b.label||b.id)+" works. "+mid+". Set those Off, or pick another bus.";
}
function fillBusPins(t, busId){
  const bp=busPins(busId);
  const live=((mods&&mods.modules)||[]).find(m=>m.bus===busId);
  const src=(live&&live.pins)||bp;
  const next={};
  (t.pins||[]).forEach(p=>{
    if(p.share==="bus"){
      const g=src[p.role]!=null?src[p.role]:bp[p.role];
      if(g!=null) next[p.role]=+g;
    }
  });
  if(bp.ss!=null && !pinTaken(+bp.ss)) next.cs=+bp.ss;
  else if(wiz.pins && wiz.pins.cs!=null) next.cs=wiz.pins.cs;
  wiz.pins=next;
}

function stepper(names, i){

}

function settingFields(t, vals){
  return ((t&&t.settings)||[]).map(s=>{
    const cur=vals[s.key]!=null?vals[s.key]:s.def;
    if(s.kind==="enum"){
      const choices=s.choices||[];
      return `<div class="field"><label>${esc(s.label||s.key)}</label>
        <div class="modes" data-set="${esc(s.key)}" role="group">
          ${choices.map(c=>`<button type="button" data-v="${esc(c.value)}"${String(c.value)===String(cur)?" class=\"on\"":""}>${esc(c.label||c.value)}</button>`).join("")}
        </div></div>`;
    }
    return `<div class="field"><label for="set-${esc(s.key)}">${esc(s.label||s.key)}</label>
      <input id="set-${esc(s.key)}" data-set="${esc(s.key)}" type="number" inputmode="numeric" value="${esc(cur)}"
        ${s.min!=null?`min="${s.min}"`:""} ${s.max!=null?`max="${s.max}"`:""}></div>`;
  }).join("");
}
function readSettings(t){
  const o={};
  ((t&&t.settings)||[]).forEach(s=>{
    if(s.kind==="enum"){
      const on=document.querySelector(`[data-set="${s.key}"] button.on`);
      const v=on?on.dataset.v:s.def;
      o[s.key]=/^-?\d+$/.test(String(v))?+v:v;
    }else{
      const n=document.getElementById("set-"+s.key);
      o[s.key]=n?+n.value:(s.def!=null?+s.def:0);
    }
  });
  return o;
}
function defaultSettings(t){

  ((t&&t.settings)||[]).forEach(s=>{

    o[s.key]=/^-?\d+$/.test(String(v))?+v:v;
  });
  return o;
}

          const txt=Object.keys(p).map(k=>k.toUpperCase()+" "+p[k]).join(" · ");
          const hit=busConflicts(b.id);
          return `<button type="button" class="pickbtn${wiz.bus===b.id?" on":""}" data-bus="${esc(b.id)}">
            <div><strong>${esc(b.label)}</strong><span>${esc(txt)}</span>
            ${hit.length?`<span class="warn">${esc(busConflictText(b))}</span>`:`<span>${esc(b.hint||"")}</span>`}</div>
          </button>`;
        }).join("")}</div>
        ${wizActs("Next","wiznext")}`;
    }else if(wiz.step===2){
      const role=inst[wiz.roleIdx||0];
      wiz.picking=role?role.role:null;
      const selected=role&&wiz.pins?wiz.pins[role.role]:null;
      const bus=busById(wiz.bus);
      const shared=busRoles(t).map(r=>r.role.toUpperCase()+" "+((wiz.pins||{})[r.role]??"—")).join(" · ");
      const done=inst.slice(0,wiz.roleIdx||0).map(r=>{
        const v=(wiz.pins||{})[r.role];
        return r.role.toUpperCase()+(v==null?" skipped":" GPIO "+v);
      }).join(" · ");
      body=`${stepper(names,2)}
        <p class="hint">${esc((bus&&bus.label)||wiz.bus)} shared: ${esc(shared)}</p>
        ${done?`<p class="hint">Already set: ${esc(done)}</p>`:""}
        <p><strong>${esc(role?role.role.toUpperCase():"")}${role&&role.required?"":" (optional)"}</strong></p>
        <p class="hint">${esc(roleHint(role))}</p>
        <p>Selected: <strong>${selected!=null?"GPIO "+selected:"none"}</strong></p>
        <div class="pinpick" id="wizpins">${wizPinButtons(selected)}</div>
        ${wizActs("Next","wiznext", role&&!role.required?`<button class="act sec" type="button" id="wizskip">Skip</button>`:"")}`;
    }else{
      wiz.picking=null;
      const id=wiz.id||nextModId((t&&t.id_prefix)||"mod");
      const vals=wiz.settings||{};
      const setHtml=settingFields(t, vals);
      body=`${stepper(names,3)}
        <p>Check the wiring, then add. The id is for MQTT and the list.</p>
        <div class="field"><label for="wizid">Id</label>
          <input id="wizid" value="${esc(id)}" autocomplete="off" maxlength="16"></div>
        ${setHtml}
        <p class="hint">${esc((t&&t.label)||wiz.type)} on ${esc(wiz.bus)} · ${esc(pinSummary(wiz.pins))}</p>
        ${wizActs("Add "+((t&&t.label)||"addon"),"wizgo")}`;
    }
  }
  box.innerHTML=body;
  applyPinFilter();
  paintPinUses();
  const back=document.getElementById("wizback");
  if(back) back.onclick=()=>wizBack();
  const cancel=document.getElementById("wizcancel");
  if(cancel) cancel.onclick=cancelWiz;
  box.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>wizPickType(b.dataset.type));
  box.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>wizPickServo());
  box.querySelectorAll("[data-bus]").forEach(b=>b.onclick=()=>{ wiz.bus=b.dataset.bus; fillBusPins(typeById(wiz.type), wiz.bus); paintWizard(); });
  const pins=document.getElementById("wizpins");
  if(pins) pins.onclick=e=>{
    const b=e.target.closest("button[data-gpio]");
    if(!b||b.disabled) return;
    wizTake(+b.dataset.gpio);
  };
  const ang=document.getElementById("wizang");
  if(ang) ang.onclick=e=>{
    const b=e.target.closest("button[data-angle]");
    if(!b) return;
    wiz.angle=+b.dataset.angle;
    const inp=document.getElementById("wizangle");
    if(inp) inp.value=wiz.angle;
    [...ang.children].forEach(x=>x.classList.toggle("on", x===b));
  };
  const skip=document.getElementById("wizskip");
  if(skip) skip.onclick=()=>{
    const t=typeById(wiz.type);
    const role=instRoles(t)[wiz.roleIdx||0];
    if(role && wiz.pins) delete wiz.pins[role.role];
    wizNextRole();
  };
  const next=document.getElementById("wiznext");
  if(next) next.onclick=wizNext;
  const go=document.getElementById("wizgo");
  if(go) go.onclick=wizCommit;
  box.querySelectorAll("[data-set]").forEach(g=>{
    g.onclick=e=>{
      const b=e.target.closest("button[data-v]");
      if(!b) return;
      [...g.querySelectorAll("button")].forEach(x=>x.classList.toggle("on", x===b));
      wiz.settings=wiz.settings||{};
      const v=b.dataset.v;
      wiz.settings[g.dataset.set]=/^-?\d+$/.test(v)?+v:v;
    };
  });
}
function wizPickType(type){
  const t=typeById(type);
  if(!t) return;
  wiz.kind="mod";
  wiz.type=type;
  wiz.bus=t.default_bus||"";
  wiz.pins={};
  wiz.settings=defaultSettings(t);
  wiz.roleIdx=0;
  wiz.id=nextModId(t.id_prefix||"mod");
  fillBusPins(t, wiz.bus);
  wiz.step=t.bus?1:2;
  paintWizard();
}
function wizPickServo(){
  wiz.kind="servo";
  wiz.step=1;
  wiz.angle=90;
  wiz.minu=500;
  wiz.maxu=2500;
  wiz.gpio=null;
  paintWizard();
}
function wizTake(g){
  if(!wizCanTake(g)){ showMsg("That pin is not free for this step", true); return; }
  if(wiz.kind==="servo") wiz.gpio=g;
  else { wiz.pins=wiz.pins||{}; wiz.pins[wiz.picking]=g; }
  paintWizard();
}
function wizBack(){
  if(!wiz) return;
  if(wiz.kind==="mod" && wiz.step===2 && (wiz.roleIdx||0)>0){ wiz.roleIdx--; paintWizard(); return; }
  if(wiz.step<=0){ cancelWiz(); return; }
  wiz.step--;
  if(wiz.kind==="mod" && wiz.step===2){
    const inst=instRoles(typeById(wiz.type));
    if(!inst.length){ wiz.step=1; paintWizard(); return; }
    wiz.roleIdx=Math.max(0, inst.length-1);
  }
  paintWizard();
}
function wizNextRole(){
  const inst=instRoles(typeById(wiz.type));
  wiz.roleIdx=(wiz.roleIdx||0)+1;
  if(wiz.roleIdx>=inst.length){ wiz.step=3; wiz.roleIdx=inst.length; }
  paintWizard();
}
function wizNext(){
  if(!wiz) return;
  if(wiz.kind==="servo"){
    if(wiz.gpio==null){ showMsg("Pick a GPIO for the servo", true); return; }
    wiz.step=2;
    paintWizard();
    return;
  }
  const t=typeById(wiz.type);
  if(wiz.step===1){
    if(!wiz.bus){ showMsg("Pick a bus", true); return; }
    const hit=busConflicts(wiz.bus);
    if(hit.length){ const b=busById(wiz.bus); showMsg(busConflictText(b||{id:wiz.bus,label:wiz.bus,pins:busPins(wiz.bus)}), true); return; }
    fillBusPins(t, wiz.bus);
    const inst=instRoles(t);
    if(!inst.length){ wiz.step=3; wiz.roleIdx=0; }
    else { wiz.step=2; wiz.roleIdx=0; }
    paintWizard();
    return;
  }
  if(wiz.step===2){
    const role=instRoles(t)[wiz.roleIdx||0];
    if(role&&role.required && (wiz.pins||{})[role.role]==null){
      showMsg("Pick a GPIO for "+role.role, true); return;
    }
    wizNextRole();
  }
}
async function wizCommit(){
  if(!wiz) return;
  if(wiz.kind==="servo"){
    const a=document.getElementById("wizangle");
    const mi=document.getElementById("wizminu");
    const ma=document.getElementById("wizmaxu");
    if(a) wiz.angle=+a.value;
    if(mi) wiz.minu=+mi.value;
    if(ma) wiz.maxu=+ma.value;
    if(wiz.gpio==null){ showMsg("Pick a GPIO for the servo", true); return; }
    const r=await cmd({cmd:"pin.configure",pin:{gpio:wiz.gpio,mode:"servo",name:"servo_"+wiz.gpio,angle:wiz.angle||90,min_us:wiz.minu||500,max_us:wiz.maxu||2500}});
    showMsg(r.ok?"Servo added on GPIO "+wiz.gpio:(r.error||"failed"), !r.ok);
    if(r.ok){ wiz=null; hw=null; drawn=null; refresh(); }
    return;
  }
  const t=typeById(wiz.type);
  const idEl=document.getElementById("wizid");
  const id=((idEl&&idEl.value)||wiz.id||"").trim();
  const bus=wiz.bus||(t&&t.default_bus)||"";
  const settings=readSettings(t);
  const r=await cmd({cmd:"module.add",type:t.type,id,bus,pins:wiz.pins||{},settings});
  showMsg(r.ok?"Added "+((t&&t.label)||id):(r.error||"failed"), !r.ok);
  if(r.ok){ wiz=null; mods=r.result; hw=null; drawn=null; refresh(); }
}
function onPadClick(g, kind, silk){
  if(wiz&&wiz.picking){
    if(g==null){ showMsg("Need a GPIO for this step", true); return; }
    wizTake(g);
    return;
  }
  if(rulePick){
    if(g==null||!ruleCanTake(g)){ showMsg("Pick an Out / PWM / Servo pin", true); return; }
    setRuleDest(g);
    rulePick=false;
    paintRuleForm();
    paintPinUses();
    return;
  }
  selectPad(g, kind, silk);
}

        if(!list.length){out.textContent="no networks found";return;}
        out.innerHTML=list.map(a=>`<button type="button" class="ssidpick" data-ssid="${esc(a.ssid)}"><span>${esc(a.ssid)||"(hidden)"}</span><span class="rssi">${rssiBars(a.rssi)}${a.rssi} dBm</span></button>`).join("");
        out.querySelectorAll(".ssidpick").forEach(b=>{
          b.onclick=()=>{document.getElementById("ssid").value=b.dataset.ssid;document.getElementById("psk").focus();};
        });
      }catch(e){out.textContent="scan failed";}
    };
    document.getElementById("save").onclick=async()=>{
      const ssid=document.getElementById("ssid").value.trim();
      if(!ssid){showMsg("Enter an SSID", true);return;}
      showMsg("Testing Wi-Fi…");
      const r=await j("/api/v1/network/wifi",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ssid,password:document.getElementById("psk").value})});
      showMsg(r.ok?"Saved. STA IP "+((r.result&&r.result.sta_ip)||"")+"  mDNS "+((st&&st.hostname)||"")+".local": (r.error||"failed"), !r.ok);
      refresh();
    };
    document.getElementById("apsave").onclick=async()=>{
      const r=await cmd({cmd:"network.ap.set_password",password:document.getElementById("appass").value});
      showMsg(r.ok?(r.result&&r.result.ap_open?"AP is open":"AP password saved. Rejoin with WPA2."):(r.error||"failed"), !r.ok);
      refresh();
    };
  }else if(tab==="MQTT"){
    const m=(st&&st.mqtt)||{};
    main.innerHTML=`<div class="card">
      ${h2("Broker","mq")}
      <div id="mmeta">${mqttMeta()}</div>
      <label for="muri">Broker URI</label><input id="muri" placeholder="mqtt://192.168.1.10:1883" value="${esc(m.uri)}" autocapitalize="none" autocomplete="off">
      <label for="mroot">Topic root</label><input id="mroot" placeholder="devices" value="${esc(m.root||"devices")}" autocapitalize="none" autocomplete="off">
      <label for="muser">Username (optional)</label><input id="muser" autocomplete="off">
      <label for="mpass">Password</label><input id="mpass" type="password" autocomplete="off">
      <button class="act" type="button" id="msave">Save (reconnects)</button>
      <p>Topics are <code>{root}/{name}/…</code>. Leave root blank for <code>devices</code>. Nested roots like <code>site/line1</code> are allowed.</p>
    </div>`;
    document.getElementById("msave").onclick=async()=>{
      const r=await j("/api/v1/mqtt",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({uri:document.getElementById("muri").value,root:document.getElementById("mroot").value.trim()||"devices",user:document.getElementById("muser").value,password:document.getElementById("mpass").value})});
      showMsg(r.ok?"MQTT saved":(r.error||JSON.stringify(r)), !r.ok); refresh();
    };
  }else if(tab==="Logs"){
    main.innerHTML=`<div class="card">${h2("Ring buffer","log")}<button class="act sec" type="button" id="rlog">Reload</button><pre id="logpre">…</pre></div>`;
    const load=()=>j("/api/v1/logs").then(x=>document.getElementById("logpre").textContent=(x.lines||[]).join(""));
    document.getElementById("rlog").onclick=load; load();
  }else if(tab==="System"){
    const o=(st&&st.ota)||{};
    main.innerHTML=`<div class="card">
      ${h2("Identity","ov")}
      <label for="dname">Name</label>
      <input id="dname" maxlength="31" autocomplete="off" value="${esc(st&&st.name||"")}">
      <button class="act" type="button" id="dsave">Save name</button>
      <p>MAC id stays <code>${esc(st&&st.id)}</code>. MQTT topics become <code>devices/&lt;name&gt;/…</code> (letters, numbers, _ and -). Duplicate names collide.</p>
    </div>
    <div class="card">
      ${h2("Memory","sys")}
      <div id="memmeta">${memoryBody()}</div>
      <p class="hint">Largest is the biggest contiguous block. A module is refused when pressure is critical or the allocation would leave under ${heap((st&&st.memory&&st.memory.reserve)||24576)} free.</p>
    </div>
    <div class="card">
      ${h2("Firmware","sys")}
      <div id="otameta">${otaBody()}</div>
      <label for="otaf">Firmware image (.bin)</label>
      <input id="otaf" type="file" accept=".bin,application/octet-stream">
      <button class="act" type="button" id="otaup">Upload and reboot</button>
      <label for="otaurl">HTTP(S) URL</label>
      <input id="otaurl" placeholder="http://192.168.1.10/de_esp32_runtime.bin" autocapitalize="none" autocomplete="off">
      <button class="act" type="button" id="otaurlgo">Pull URL and reboot</button>
      <button class="act danger" type="button" id="otaroll" ${o.rollback_possible?"":"disabled"}>Rollback to previous slot</button>
      <p>Upload writes the inactive A/B slot. First boot is pending; a crash before healthy rolls back. Signed images are later. HTTPS uses the public CA bundle — LAN pulls should use <code>http://</code>.</p>
    </div>
    <div class="card hot">
      ${h2("Device","sys")}
      <button class="act sec" type="button" id="reb">Reboot</button>
      <button class="act danger" type="button" id="fac">Factory reset (keeps MAC identity)</button>
      <p>Factory reset clears Wi-Fi, pins, rules, MQTT, and the AP password (recovery AP is open again).</p>
      <p>Physical recovery (press BOOT <em>after</em> the app is running, not while resetting): 5s recovery AP, 10s clear Wi-Fi, 20s factory reset.</p>
    </div>`;
    document.getElementById("dsave").onclick=async()=>{
      const name=document.getElementById("dname").value.trim();
      if(!name){showMsg("Enter a name", true);return;}
      const r=await cmd({cmd:"identity.set_name",name});
      showMsg(r.ok?"MQTT topics now "+(((r.result&&r.result.topic_id)||name)):(r.error||"failed"), !r.ok);
      spec=null;
      refresh();
    };
    document.getElementById("otaup").onclick=async()=>{
      const f=document.getElementById("otaf").files[0];
      if(!f){showMsg("Choose a .bin first", true);return;}
      if(!confirm("Flash "+f.name+" ("+f.size+" bytes) and reboot?"))return;
      showMsg("Uploading "+f.size+" bytes…");
      try{
        const r=await fetch("/api/v1/ota",{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:f}).then(x=>x.json());
        showMsg(r.ok?"Written. Rebooting into the new slot…":(r.error||"failed"), !r.ok);
      }catch(e){showMsg("Upload finished or the device rebooted.", false);}
    };
    document.getElementById("otaurlgo").onclick=async()=>{
      const url=document.getElementById("otaurl").value.trim();
      if(!url){showMsg("Enter an http:// or https:// URL", true);return;}
      if(!confirm("Pull "+url+" and reboot?"))return;
      const r=await cmd({cmd:"ota.apply",url});
      showMsg(r.ok?"Fetching. The device reboots when the image is written.":(r.error||"failed"), !r.ok);
      refresh();
    };
    document.getElementById("otaroll").onclick=async()=>{
      if(!confirm("Reboot into the previous firmware slot?"))return;
      showMsg("Rolling back…");
      try{await cmd({cmd:"ota.rollback"});}catch(e){}
    };
    document.getElementById("reb").onclick=()=>{showMsg("Rebooting…");fetch("/api/v1/system/reboot",{method:"POST"});};
    document.getElementById("fac").onclick=()=>{if(confirm("Erase user config?")){showMsg("Factory reset…");fetch("/api/v1/system/factory_reset",{method:"POST"});}};
  }else if(tab==="API"){
    if(!spec){j("/api/v1/openapi.json").then(x=>{spec=x;drawn=null;render()}).catch(()=>{main.innerHTML="<div class='card bad'>OpenAPI fetch failed</div>"});main.innerHTML=`<div class="card"><p class="wait">loading OpenAPI…</p></div>`;return;}
    const servers=(spec.servers||[]).map(s=>`<code>${esc(s.url)}</code>`).join(" · ");
    const disc=spec["x-discovery"]||{};
    const paths=spec.paths||{};
    const pathRows=Object.keys(paths).map(p=>Object.keys(paths[p]).map(m=>{
      const op=paths[p][m]||{};
      const tryGet=(m==="get"&&!op["x-websocket"])?`<button class="act sec" type="button" data-get="${esc(p)}">GET</button>`:"";
      return `<tr><td><span class="b">${esc(m.toUpperCase())}</span></td><td><code>${esc(p)}</code></td><td>${esc(op.summary||"")}</td><td>${tryGet}</td></tr>`;
    }).join("")).join("");
    const mqtt=spec["x-mqtt"]||{};
    const trows=(mqtt.topics||[]).map(t=>`<tr><td>${t.subscribe?"sub":""}${t.publish?(t.subscribe?"/pub":"pub"):""}${t.retain?" ret":""}</td><td><code>${esc(t.topic)}</code></td><td>${esc(t.summary||"")}</td></tr>`).join("");
    const cmds=(spec["x-commands"]||[]).map(c=>`<tr class="cmdrow" data-cmd="${esc(c.cmd)}"><td><code>${esc(c.cmd)}</code></td><td>${esc(c.summary||"")}</td></tr>`).join("");
    main.innerHTML=`<div class="card">
      ${h2("OpenAPI","api")}
      <p>${esc(spec.info&&spec.info.title)} ${esc(spec.info&&spec.info.version)} · OpenAPI ${esc(spec.openapi)}</p>
      <p>servers ${servers||"—"}</p>
      <p>mDNS <code>${esc(disc.mdns)}.local</code> · <code>${esc(disc.service)}</code> :${disc.port||80}</p>
      <p>This page is a client of <code>/api/v1/openapi.json</code> — it does not keep a second route list.</p>
      <button class="act sec" type="button" id="apireload">Reload spec</button>
    </div>
    <div class="card">
      ${h2("HTTP","api")}
      <table><tr><th></th><th>path</th><th></th><th></th></tr>${pathRows}</table>
    </div>
    <div class="card">
      ${h2("MQTT","mq")}
      <p>prefix <code>${esc(mqtt.prefix||"")}</code></p>
      <table><tr><th></th><th>topic</th><th></th></tr>${trows}</table>
    </div>
    <div class="card">
      ${h2("Commands","api")}
      <p>Click a row to fill, then POST <code>/api/v1/command</code></p>
      <table><tr><th>cmd</th><th></th></tr>${cmds}</table>
      <label for="apibody">JSON</label>
      <textarea id="apibody" rows="6">{"cmd":"pin.set","gpio":4,"value":1,"mode":"out"}</textarea>
      <button class="act" type="button" id="apigo">POST command</button>
      <pre id="apiout"></pre>
    </div>`;
    const out=document.getElementById("apiout");
    main.querySelectorAll("[data-get]").forEach(b=>{
      b.onclick=()=>j(b.dataset.get).then(x=>{out.textContent=JSON.stringify(x,null,2);}).catch(e=>{out.textContent=String(e);});
    });
    main.querySelectorAll("[data-cmd]").forEach(tr=>{
      tr.onclick=()=>{
        const c=(spec["x-commands"]||[]).find(x=>x.cmd===tr.dataset.cmd);
        document.getElementById("apibody").value=JSON.stringify((c&&c.example)||{cmd:tr.dataset.cmd},null,2);
      };
    });
    document.getElementById("apireload").onclick=()=>{spec=null;drawn=null;render();};
    document.getElementById("apigo").onclick=async()=>{
      let body;
      try{body=JSON.parse(document.getElementById("apibody").value);}catch(e){showMsg("Invalid JSON", true);return;}
      const r=await cmd(body);
      out.textContent=JSON.stringify(r,null,2);
      showMsg(r.ok?"ok":(r.error||"failed"), !r.ok);
    };
  }
}
function applyIoEvent(d){
  if(d && d.id && (d.type==="mfrc522" || d.type==="bme280")){
    if(!st) st={};
    if(!st.io) st.io={};
    st.io["mod_"+d.id]=d;
    const n=document.getElementById("modlive-"+d.id);
    if(n) n.textContent=addonLiveText({type:d.type,id:d.id}, d);
    if(tab==="Hardware") paintPinUses();
    if(tab==="Overview") paintDash();
    return;
  }
  if(!d || d.gpio==null) return;
  if(!st) st={};
  if(!st.io) st.io={};
  const id=d.id||((d.mode==="adc"?"adc_":d.mode==="pwm"?"pwm_":d.mode==="servo"?"servo_":"gpio_")+d.gpio);
  ["gpio_","pwm_","adc_","servo_"].forEach(p=>{ const k=p+d.gpio; if(k!==id) delete st.io[k]; });
  st.io[id]=d;
  if(tab==="Hardware"){ paintPinUses(); paintAddonLive(); }
  if(tab==="Overview") paintDash();
}
function connectWs(){
  if(!wantWs) return;
  if(ws && (ws.readyState===0||ws.readyState===1)) return;
  try{
    ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/api/v1/ws");
    ws.onmessage=ev=>{
      let m;
      try{m=JSON.parse(ev.data);}catch(e){refresh();return;}
      if(m && typeof m.topic==="string" && m.topic.indexOf("io/")===0){
        applyIoEvent(m.data);
        return;
      }
      refresh();
    };
    ws.onclose=()=>{ws=null; if(wantWs) setTimeout(connectWs,3000);};
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{
  wantWs=!document.hidden;
  if(wantWs) connectWs();
  else if(ws){ const w=ws; ws=null; w.close(); }
});
refresh(); setInterval(()=>{ if(!document.hidden) refresh(); },8000); connectWs();
</script>
</body>
</html>
