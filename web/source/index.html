 if(!spec)try{spec=await j("/api/v1/openapi.json")}catch(e){$("api").innerHTML=card("OpenAPI",4,'<p class="bad">fetch failed</p>');return}
 if(tab!=4)return;const P=spec.paths||{},M=spec["x-mqtt"]||{},dc=spec["x-discovery"]||{};
 $("api").innerHTML=card("OpenAPI",4,`<p class="hint" style="margin:0">${esc(spec.info.title)} ${esc(spec.info.version)} · OpenAPI ${esc(spec.openapi)} · mDNS <code>${esc(dc.mdns)}.local</code> <code>${esc(dc.service)}</code>:${dc.port||80}</p><p class="hint">Rendered from <code>/api/v1/openapi.json</code>; the UI keeps no second route list.</p>`+`<table>${Object.keys(P).map(p=>Object.keys(P[p]).map(m=>{const op=P[p][m];return `<tr><td><span class="b">${m.toUpperCase()}</span></td><td><code>${esc(p)}</code></td><td>${esc(op.summary||"")}</td><td>${m=="get"&&!op["x-websocket"]?`<button class="btn s sm" data-get="${esc(p)}">GET</button>`:""}</td></tr>`}).join("")).join("")}</table>`)+
 card("MQTT topics",4,`<p class="hint" style="margin:0 0 8px">prefix <code>${esc(M.prefix||"")}</code></p><table>${(M.topics||[]).map(t=>`<tr><td>${t.subscribe?"sub":""}${t.publish?(t.subscribe?"/pub":"pub"):""}${t.retain?" ret":""}</td><td><code>${esc(t.topic)}</code></td><td>${esc(t.summary||"")}</td></tr>`).join("")}</table>`)+
 card("Commands",4,`<p class="hint" style="margin:0 0 8px">Tap a row to fill the box, then POST <code>/api/v1/command</code>.</p><table>${(spec["x-commands"]||[]).map(c=>`<tr data-cmd="${esc(c.cmd)}"><td><code>${esc(c.cmd)}</code></td><td>${esc(c.summary||"")}</td></tr>`).join("")}</table><label for="abody">JSON</label><textarea id="abody" rows="5">{"cmd":"pin.set","gpio":4,"value":1,"mode":"out"}</textarea><button class="btn" id="ago">POST command</button><pre id="aout">—</pre>`);
 QA("[data-get]").forEach(b=>b.onclick=()=>j(b.dataset.get).then(x=>$("aout").textContent=JSON.stringify(x,null,2)));
 QA("tr[data-cmd]").forEach(r=>r.onclick=()=>{const c=spec["x-commands"].find(x=>x.cmd==r.dataset.cmd);$("abody").value=JSON.stringify(c.example||{cmd:c.cmd},null,2)});
 $("ago").onclick=async()=>{let b;try{b=JSON.parse($("abody").value)}catch(e){return toast("Invalid JSON",1)}const r=await cmd(b);$("aout").textContent=JSON.stringify(r,null,2);toast(r.ok?"ok":r.error||"failed",!r.ok)};
}
/* ---- live socket: I/O events only, closed while hidden ---- */
let rt;const soon=()=>{if(!rt)rt=setTimeout(()=>{rt=0;refresh()},800)};
function wsOpen(){if(ws||document.hidden)return;try{ws=new WebSocket((location.protocol=="https:"?"wss":"ws")+"://"+location.host+"/api/v1/ws");ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return soon()}if(!m||!/^io\//.test(m.topic||""))return soon();const d=m.data||{},k=d.gpio!=null?key(d):"mod_"+d.id;(st.io=st.io||{})[k]=Object.assign(st.io[k]||{},d);live()};ws.onclose=()=>{ws=null;setTimeout(wsOpen,3000)}}catch(x){}}
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(ws){const w=ws;ws=null;w.close()}}else{refresh();wsOpen()}});
refresh().then(render);setInterval(()=>{if(!document.hidden)refresh()},8000);wsOpen();
</script>
</body>
</html>
