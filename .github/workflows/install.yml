name: Install page

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: install-page
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Firmware sources changed
        id: fw
        shell: bash
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" HEAD | grep -Eq '^(main/|components/|web/|CMakeLists.txt|partitions.csv|sdkconfig.defaults)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ESP-IDF 5.4.2
        if: steps.fw.outputs.build == 'true'
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32
          command: idf.py set-target esp32 && idf.py build

      - name: Stage installer images
        if: steps.fw.outputs.build == 'true'
        run: |
          mkdir -p install/firmware
          cp build/bootloader/bootloader.bin install/firmware/bootloader.bin
          cp build/partition_table/partition-table.bin install/firmware/partition-table.bin
          cp build/de_esp32_runtime.bin install/firmware/de_esp32_runtime.bin

      - name: Commit installer images
        if: steps.fw.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/firmware
          if git diff --staged --quiet; then
            echo "Images unchanged."
            exit 0
          fi
          git commit -m "Update browser installer images from the CI build."
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: install

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
